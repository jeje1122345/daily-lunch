name: Daily Lunch Auto Generator

on:
  schedule:
    # 台灣時間 (UTC+8) 平日 11:00 = UTC 03:00 (週一至週五)
    - cron: '0 3 * * 1-5'
  workflow_dispatch: # 支援在網頁上手動點擊立即執行

permissions:
  contents: write # 賦予自動提交與更新 index.html 權限

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          pip install google-genai

      - name: 執行腳本生成 HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_menu.py

      - name: 提交並推送更新至 main 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto update daily lunch menu" || echo "No changes to commit"
          git push
